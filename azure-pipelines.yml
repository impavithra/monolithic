trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

# =====================================================
# CI - BUILD, TEST, SONARQUBE
# =====================================================

- stage: Build
  displayName: 'Build, Test and SonarQube'

  jobs:
  - job: Build
    displayName: 'Maven Build'

    steps:

    # =================================================
    # Setup MySQL
    # =================================================

    - script: |
        sudo systemctl start mysql

        sudo mysqladmin -u root password 'root' || true

        mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS snowman;"

        mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'username'@'localhost' IDENTIFIED BY 'password';"

        mysql -uroot -proot -e "ALTER USER 'username'@'localhost' IDENTIFIED BY 'password';"

        mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON snowman.* TO 'username'@'localhost';"

        mysql -uroot -proot -e "FLUSH PRIVILEGES;"

        mysql -uusername -ppassword -e "SHOW DATABASES;"
      displayName: 'Setup MySQL'


    # =================================================
    # BUILD + TEST USING JAVA 8
    # =================================================

    - task: Maven@4
      displayName: 'Maven Build and Test'
      inputs:
        mavenPOMFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'

        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'

        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

        goals: 'clean package'


    # =================================================
    # CHECK GENERATED JAR
    # =================================================

    - script: |
        echo "======================================"
        echo "Generated files"
        echo "======================================"

        ls -lh target

        echo ""
        echo "JAR files:"
        find target -maxdepth 1 -type f -name "*.jar" -print
      displayName: 'Check Generated JAR'


    # =================================================
    # PREPARE SONARQUBE
    # =================================================

    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sonarqube-connection'
        scannerMode: 'other'

        extraProperties: |
          sonar.projectKey=snowman
          sonar.projectName=Snowman


    # =================================================
    # SONARQUBE ANALYSIS USING JAVA 17
    # =================================================

    - task: Maven@4
      displayName: 'SonarQube Analysis'
      inputs:
        mavenPOMFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'

        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        jdkArchitectureOption: 'x64'

        publishJUnitResults: false

        goals: 'sonar:sonar'

        sonarQubeRunAnalysis: false


    # =================================================
    # PUBLISH SONARQUBE QUALITY GATE
    # =================================================

    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'


    # =================================================
    # PUBLISH JAR ARTIFACT
    # =================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish JAR Artifact'
      inputs:
        PathtoPublish: 'target'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# =====================================================
# CD - DEPLOY TO AZURE VM
# =====================================================

- stage: Deploy
  displayName: 'Deploy to Azure VM'

  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: 'Deploy JAR'

    steps:

    # =================================================
    # DOWNLOAD ARTIFACT
    # =================================================

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'


    # =================================================
    # CHECK ARTIFACT
    # =================================================

    - script: |
        echo "======================================"
        echo "Downloaded artifacts"
        echo "======================================"

        find "$(System.ArtifactsDirectory)/drop" -type f -print
      displayName: 'Check Downloaded Artifact'


    # =================================================
    # CREATE APPLICATION DIRECTORY
    # =================================================

    - task: SSH@0
      displayName: 'Prepare Application Directory'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        runOptions: 'inline'
        inline: |
          mkdir -p /home/azureuser/app


    # =================================================
    # COPY JAR TO AZURE VM
    # =================================================

    - task: CopyFilesOverSSH@0
      displayName: 'Copy JAR to Azure VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        sourceFolder: '$(System.ArtifactsDirectory)/drop'
        contents: '*.jar'
        targetFolder: '/home/azureuser/app'
        overwrite: true


    # =================================================
    # START APPLICATION
    # =================================================

    - task: SSH@0
      displayName: 'Run Application on Azure VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        runOptions: 'inline'

        inline: |

          echo "======================================"
          echo "Starting application deployment"
          echo "======================================"

          mkdir -p /home/azureuser/app

          echo "Stopping old application..."

          pkill -f 'java -jar' || true

          sleep 3

          echo "Available JAR files:"

          ls -lh /home/azureuser/app/*.jar

          JAR=$(find /home/azureuser/app \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | head -1)

          if [ -z "$JAR" ]; then
            echo "ERROR: JAR file not found!"
            exit 1
          fi

          echo "Starting application:"
          echo "$JAR"

          nohup java -jar "$JAR" \
            > /home/azureuser/app/app.log 2>&1 &

          echo $! > /home/azureuser/app/app.pid

          sleep 10

          echo ""
          echo "======================================"
          echo "Application log"
          echo "======================================"

          tail -30 /home/azureuser/app/app.log

          echo ""
          echo "======================================"
          echo "Application deployed successfully"
          echo "======================================"