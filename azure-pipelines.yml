trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

# =====================================================
# CI - BUILD, TEST AND SONARQUBE
# =====================================================

- stage: Build
  displayName: 'Build, Test and SonarQube'

  jobs:
  - job: Build
    displayName: 'Maven Build'

    steps:

    # -------------------------------
    # Setup MySQL
    # -------------------------------

    - script: |
        sudo systemctl start mysql

        sudo mysqladmin -u root password 'root'

        mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS snowman;"
        mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'username'@'localhost' IDENTIFIED BY 'password';"
        mysql -uroot -proot -e "ALTER USER 'username'@'localhost' IDENTIFIED BY 'password';"
        mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON snowman.* TO 'username'@'localhost';"
        mysql -uroot -proot -e "FLUSH PRIVILEGES;"

        mysql -uusername -ppassword -e "SHOW DATABASES;"
      displayName: 'Setup MySQL'


    # -------------------------------
    # Prepare SonarQube
    # -------------------------------

    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sonarqube-connection'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'snowman'
        cliProjectName: 'Snowman'
        cliSources: '.'


    # -------------------------------
    # Maven Build and Test
    # -------------------------------

    - task: Maven@3
      displayName: 'Maven Build and Test'
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'clean verify'


    # -------------------------------
    # Run SonarQube Analysis
    # -------------------------------

    - task: SonarQubeAnalyze@7
      displayName: 'Run SonarQube Analysis'


    # -------------------------------
    # Publish Quality Gate
    # -------------------------------

    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'


    # -------------------------------
    # Check JAR
    # -------------------------------

    - script: |
        echo "Files generated inside target:"
        ls -lh target
      displayName: 'Check JAR'


    # -------------------------------
    # Publish Artifact
    # -------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish JAR Artifact'
      inputs:
        PathtoPublish: 'target'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# =====================================================
# CD - DEPLOY TO AZURE VM
# =====================================================

- stage: Deploy
  displayName: 'Deploy to Azure VM'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy JAR'

    steps:

    # -------------------------------
    # Download Artifact
    # -------------------------------

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'


    # -------------------------------
    # Check Artifact
    # -------------------------------

    - script: |
        echo "Downloaded files:"
        find "$(System.ArtifactsDirectory)/drop" -type f
      displayName: 'Check Artifact'


    # -------------------------------
    # Copy JAR to Azure VM
    # -------------------------------

    - task: CopyFilesOverSSH@0
      displayName: 'Copy JAR to Azure VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        sourceFolder: '$(System.ArtifactsDirectory)/drop'
        contents: '*.jar'
        targetFolder: '/home/azureuser/app'
        overwrite: true


    # -------------------------------
    # Start Application
    # -------------------------------

    - task: SSH@0
      displayName: 'Run Application on VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        runOptions: 'inline'
        inline: |
          mkdir -p /home/azureuser/app

          pkill -f 'java -jar' || true

          JAR=$(find /home/azureuser/app -name "*.jar" | head -1)

          echo "Starting: $JAR"

          nohup java -jar "$JAR" > /home/azureuser/app/app.log 2>&1 &

          echo "Application deployed successfully"

          sleep 10

          echo "Application log:"
          tail -20 /home/azureuser/app/app.log