trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

# =====================================================
# CI - BUILD, TEST, SONARQUBE
# =====================================================

- stage: Build
  displayName: 'Build, Test and SonarQube'

  jobs:
  - job: Build
    displayName: 'Maven Build'

    steps:

    # -------------------------------
    # Setup MySQL
    # -------------------------------

    - script: |
        sudo systemctl start mysql

        sudo mysqladmin -u root password 'root' || true

        mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS snowman;"

        mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'username'@'localhost' IDENTIFIED BY 'password';"

        mysql -uroot -proot -e "ALTER USER 'username'@'localhost' IDENTIFIED BY 'password';"

        mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON snowman.* TO 'username'@'localhost';"

        mysql -uroot -proot -e "FLUSH PRIVILEGES;"

        mysql -uusername -ppassword -e "SHOW DATABASES;"

      displayName: 'Setup MySQL'


    # -------------------------------
    # Prepare SonarQube
    # -------------------------------

    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sonarqube-connection'
        scannerMode: 'other'
        extraProperties: |
          sonar.projectKey=snowman
          sonar.projectName=Snowman


    # -------------------------------
    # Maven Build
    # -------------------------------

    - task: Maven@4
      displayName: 'Maven Build'
      inputs:
        mavenPOMFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'clean package -DskipTests'


    # -------------------------------
    # SonarQube Analysis
    # -------------------------------

    - task: SonarQubeAnalyze@7
      displayName: 'SonarQube Analysis'


    # -------------------------------
    # SonarQube Quality Gate
    # -------------------------------

    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'


    # -------------------------------
    # Verify JAR
    # -------------------------------

    - script: |
        echo "======================================"
        echo "TARGET DIRECTORY"
        echo "======================================"

        ls -lh target

        echo ""
        echo "======================================"
        echo "Snowman.jar"
        echo "======================================"

        if [ ! -f target/Snowman.jar ]; then
          echo "ERROR: target/Snowman.jar not found!"
          exit 1
        fi

        ls -lh target/Snowman.jar

      displayName: 'Verify Snowman JAR'


    # -------------------------------
    # Create deployment artifact
    # -------------------------------

    - task: CopyFiles@2
      displayName: 'Prepare Deployment Artifact'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/target'
        Contents: 'Snowman.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/drop'


    # -------------------------------
    # Publish ONLY Snowman.jar
    # -------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Snowman JAR'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# =====================================================
# CD - DEPLOY TO AZURE VM
# =====================================================

- stage: Deploy
  displayName: 'Deploy to Azure VM'

  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: 'Deploy Snowman Application'

    steps:

    # -------------------------------
    # Download artifact
    # -------------------------------

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'


    # -------------------------------
    # Verify downloaded artifact
    # -------------------------------

    - script: |
        echo "======================================"
        echo "DOWNLOADED ARTIFACT"
        echo "======================================"

        find "$(System.ArtifactsDirectory)/drop" -type f -print

        echo ""
        echo "Checking Snowman.jar..."

        if [ ! -f "$(System.ArtifactsDirectory)/drop/Snowman.jar" ]; then
          echo "ERROR: Snowman.jar not found in artifact!"
          exit 1
        fi

        ls -lh "$(System.ArtifactsDirectory)/drop/Snowman.jar"

      displayName: 'Verify Downloaded Snowman JAR'


    # -------------------------------
    # Prepare VM
    # -------------------------------

    - task: SSH@0
      displayName: 'Prepare VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        runOptions: 'inline'
        inline: |
          echo "Cleaning old application..."

          mkdir -p /home/azureuser/app

          pkill -f 'Snowman.jar' || true

          rm -f /home/azureuser/app/*.jar
          rm -f /home/azureuser/app/app.log
          rm -f /home/azureuser/app/app.pid

          echo "VM prepared."


    # -------------------------------
    # Copy ONLY Snowman.jar
    # -------------------------------

    - task: CopyFilesOverSSH@0
      displayName: 'Copy Snowman JAR to Azure VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        sourceFolder: '$(System.ArtifactsDirectory)/drop'
        contents: 'Snowman.jar'
        targetFolder: '/home/azureuser/app'
        overwrite: true


    # -------------------------------
    # Start application
    # -------------------------------

    - task: SSH@0
      displayName: 'Start Snowman Application'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        runOptions: 'inline'
        inline: |

          echo "======================================"
          echo "STARTING SNOWMAN APPLICATION"
          echo "======================================"

          JAR="/home/azureuser/app/Snowman.jar"

          if [ ! -f "$JAR" ]; then
            echo "ERROR: Snowman.jar not found!"
            exit 1
          fi

          echo "JAR found:"
          ls -lh "$JAR"

          echo "Starting application..."

          nohup java -jar "$JAR" \
            > /home/azureuser/app/app.log 2>&1 &

          echo $! > /home/azureuser/app/app.pid

          sleep 10

          echo ""
          echo "======================================"
          echo "APPLICATION LOG"
          echo "======================================"

          cat /home/azureuser/app/app.log

          echo ""
          echo "======================================"
          echo "PROCESS"
          echo "======================================"

          if ps -p $(cat /home/azureuser/app/app.pid) > /dev/null 2>&1; then
            echo "Application is RUNNING"
          else
            echo "ERROR: Application failed to start"
            exit 1
          fi

          echo ""
          echo "Application deployed successfully."