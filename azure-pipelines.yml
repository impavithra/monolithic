trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

# ================= CI =================

- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: Build
    displayName: 'Maven Build'

    steps:

    # Setup MySQL
    - script: |
        sudo systemctl start mysql

        sudo mysqladmin -u root password 'root'

        mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS snowman;"
        mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'username'@'localhost' IDENTIFIED BY 'password';"
        mysql -uroot -proot -e "ALTER USER 'username'@'localhost' IDENTIFIED BY 'password';"
        mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON snowman.* TO 'username'@'localhost';"
        mysql -uroot -proot -e "FLUSH PRIVILEGES;"

        mysql -uusername -ppassword -e "SHOW DATABASES;"
      displayName: 'Setup MySQL'

    # Prepare SonarQube
    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sonarqube-connection'
        scannerMode: 'other'
        extraProperties: |
          sonar.projectKey=snowman
          sonar.projectName=Snowman

    # Maven Build + Test + SonarQube
    - task: Maven@3
      displayName: 'Maven Build, Test and SonarQube Analysis'
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'clean verify sonar:sonar'

    # Publish SonarQube Quality Gate
    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # Check generated files
    - script: |
        echo "Files generated inside target:"
        ls -lh target
      displayName: 'Check JAR'

    # Publish target folder
    - task: PublishBuildArtifacts@1
      displayName: 'Publish JAR Artifact'
      inputs:
        PathtoPublish: 'target'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# ================= CD =================

- stage: Deploy
  displayName: 'Deploy to Azure VM'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy JAR'

    steps:

    # Download artifact
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Check downloaded files
    - script: |
        echo "Downloaded files:"
        find "$(System.ArtifactsDirectory)/drop" -type f
      displayName: 'Check Artifact'

    # Copy JAR to Azure VM
    - task: CopyFilesOverSSH@0
      displayName: 'Copy JAR to Azure VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        sourceFolder: '$(System.ArtifactsDirectory)/drop'
        contents: '*.jar'
        targetFolder: '/home/azureuser/app'
        overwrite: true

    # Run application on VM
    - task: SSH@0
      displayName: 'Run Application on VM'
      inputs:
        sshEndpoint: 'pv-vm-ssh'
        runOptions: 'inline'
        inline: |
          mkdir -p /home/azureuser/app

          pkill -f 'java -jar' || true

          JAR=$(find /home/azureuser/app -name "*.jar" | head -1)

          echo "Starting: $JAR"

          nohup java -jar "$JAR" > /home/azureuser/app/app.log 2>&1 &

          echo "Application deployed successfully"

          sleep 10

          echo "Application log:"
          tail -20 /home/azureuser/app/app.log